# Scanning an image that already lives in a private registry, using a Docker
# Registry service connection for its credentials -- no local build step involved.
#
# Assumes:
#   - Same agent prerequisites as 01-filesystem-scan-plain-agent.yml.
#   - A Docker Registry service connection named "MyRegistryConnection" already
#     exists in this project (Project Settings > Service connections > New service
#     connection > Docker Registry), holding credentials for registry.example.com.
#   - The image reference below is reachable from the build agent over whatever
#     network the collection's runners already use.
#
# Produces:
#   - A vulnerability scan of the named image, pulled directly from the registry by
#     trivy itself (inside the scan container) using the service connection's
#     credentials. Those credentials reach trivy as TRIVY_USERNAME/TRIVY_PASSWORD --
#     the same two environment variables the database-mirror credentials
#     (dbRegistryUsername/dbRegistryPassword in the collection's Defaults tab) would
#     otherwise use. If both are configured, the target image's credentials win for
#     this scan and the database-mirror credentials are dropped with a warning; see
#     the README section on the "defaults" settings document.

trigger: none

pool:
  name: Default

steps:
  - task: TrivyScan@1
    inputs:
      scanType: image
      target: registry.example.com/app:1.4.2
      targetRegistryConnection: MyRegistryConnection
